<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- 背景 -->
    <radialGradient id="symBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- 人类意志共识轨道：坚实的蔚蓝到亮白 -->
    <linearGradient id="humanTrack" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="80%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Agent 助手生成探索轨道：灵动的翡翠青绿到薄荷蓝 -->
    <linearGradient id="agentTrack" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="80%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <!-- 注意力聚焦透镜光晕 -->
    <filter id="focusHalo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="needleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- 1. 背景 -->
  <rect width="800" height="800" fill="url(#symBg)"/>

  <!-- 2. 【可视化体系】背景中隐现的 01-04 阶段时间轴阶梯与经纬同心圆 -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.2">
    <!-- 4 个阶段时间轴同心环 (Phase 01 ~ Phase 04) -->
    <circle cx="400" cy="380" r="230" fill="none" stroke-dasharray="2 6"/>
    <circle cx="400" cy="380" r="170" fill="none"/>
    <circle cx="400" cy="380" r="110" fill="none" stroke-dasharray="4 8"/>
    
    <!-- 四方位标尺 -->
    <line x1="170" y1="380" x2="630" y2="380"/>
    <line x1="400" y1="150" x2="400" y2="610"/>

    <!-- 阶段刻度文字 -->
    <text x="400" y="130" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">PHASE 04 · CONFIRMED TRUTH</text>
  </g>

  <!-- 3. 【发展历史体现】双螺旋指针由分至合：
       底部：两轨相隔 80px (早期：人机目标割裂、各自为战、冲突多发)
       中部：交汇于注意力焦点 (中期：引入 Triage 秒批与 0.15s 取证)
       顶部：合二为一化为锋利真北指针 (现在：M1/M2/M3 闭环，人机共生指向真理) -->
  <g filter="url(#needleShadow)">
    
    <!-- 左轨 (人类意图主线) : 实体光滑实线 -->
    <path d="M 350 560 C 350 480, 385 430, 400 380 C 400 340, 395 260, 400 190" 
          fill="none" 
          stroke="url(#humanTrack)" 
          stroke-width="4.5" 
          stroke-linecap="round"/>

    <!-- 右轨 (Agent 助手流) : 伴有脉冲点状微刻度，在交界处并轨 -->
    <path d="M 450 560 C 450 480, 415 430, 400 380 C 400 340, 405 260, 400 190" 
          fill="none" 
          stroke="url(#agentTrack)" 
          stroke-width="3" 
          stroke-linecap="round"
          stroke-dasharray="8 4"/>

    <!-- 顶部合一：化身为绝对锋利的罗盘真北针尖 (True North Arrowhead) -->
    <polygon points="400,165 384,205 416,205" fill="#ffffff" filter="url(#focusHalo)"/>
    <polygon points="400,165 400,205 416,205" fill="#38bdf8"/>

    <!-- 底部起始双锚点 (人类起点 vs Agent 起点) -->
    <circle cx="350" cy="560" r="8" fill="#0f172a" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="350" cy="560" r="3" fill="#60a5fa"/>
    <text x="350" y="585" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#60a5fa">HUMAN INTENT</text>

    <circle cx="450" cy="560" r="8" fill="#0f172a" stroke="#059669" stroke-width="2.5"/>
    <circle cx="450" cy="560" r="3" fill="#34d399"/>
    <text x="450" y="585" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#34d399">AGENT STREAM</text>
  </g>

  <!-- 4. 【注意力集中体现】中央咬合焦点：0.15s 悬停秒批透镜 (The Convergence Hub) -->
  <g filter="url(#focusHalo)">
    <!-- 扩散波纹 -->
    <circle cx="400" cy="380" r="24" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="400" cy="380" r="12" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <!-- 绿色秒批成功勾选点 (已采纳团队事实) -->
    <circle cx="400" cy="380" r="4" fill="#10b981"/>
  </g>

  <!-- 5. 底部文字 -->
  <text x="400" y="660" 
        text-anchor="middle" 
        font-family="'Inter', sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#f8fafc">COMPASS · SYMBIOSIS</text>
        
  <text x="400" y="690" 
        text-anchor="middle" 
        font-family="'Geist Mono', monospace" 
        font-size="11" 
        letter-spacing="2" 
        fill="#94a3b8">HUMAN INTENT · AGENT DISCOVERY · TRUE NORTH</text>
</svg>
