<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- 温润象牙纸质底色渐变 -->
    <radialGradient id="paperBg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="60%" stop-color="#F4EFE6"/>
      <stop offset="100%" stop-color="#EAE3D5"/>
    </radialGradient>

    <!-- 朱砂红火漆印泥质感渐变 (The Vermilion Seal) -->
    <radialGradient id="waxSealGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="45%" stop-color="#DC2626"/>
      <stop offset="85%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </radialGradient>

    <!-- 典雅铸铁墨黑渐变 -->
    <linearGradient id="ironInkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>

    <!-- 柔和纸质微阴影 -->
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#785B3C" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#785B3C" flood-opacity="0.1"/>
    </filter>

    <filter id="sealEmboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7F1D1D" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 1. 背景：温润象牙微质感纸面 -->
  <rect width="800" height="800" fill="url(#paperBg)"/>

  <!-- 2. 手工版画微木刻辅助经纬圆 (细墨线，模拟 19 世纪古典出版物) -->
  <g stroke="rgba(24, 24, 27, 0.12)" stroke-width="1.2">
    <circle cx="400" cy="380" r="230" fill="none"/>
    <circle cx="400" cy="380" r="222" fill="none" stroke-dasharray="2 4"/>
    <circle cx="400" cy="380" r="160" fill="none"/>
    <!-- 四角古典小标花 -->
    <line x1="400" y1="130" x2="400" y2="150" stroke="#71717A" stroke-width="1.5"/>
    <line x1="400" y1="610" x2="400" y2="630" stroke="#71717A" stroke-width="1.5"/>
    <line x1="150" y1="380" x2="170" y2="380" stroke="#71717A" stroke-width="1.5"/>
    <line x1="630" y1="380" x2="650" y2="380" stroke="#71717A" stroke-width="1.5"/>
  </g>

  <!-- 3. 主体：藏书票古典罗盘与代码树 (The Editorial Plate) -->
  <g filter="url(#paperShadow)">
    
    <!-- 罗盘外圈铸铁圆环 -->
    <circle cx="400" cy="380" r="190" fill="#FCFAF6" stroke="url(#ironInkGrad)" stroke-width="3"/>
    
    <!-- 罗盘盘面细密手工木刻刻度 (360度发丝木刻) -->
    <circle cx="400" cy="380" r="178" fill="none" stroke="rgba(24, 24, 27, 0.25)" stroke-width="1" stroke-dasharray="2 8"/>
    
    <!-- 罗盘四方位古典衬线字标 -->
    <text x="400" y="225" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="16" font-weight="700" fill="#18181B">N</text>
    <text x="400" y="550" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="14" fill="#71717A">S</text>
    <text x="560" y="385" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="14" fill="#71717A">E</text>
    <text x="240" y="385" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="14" fill="#71717A">W</text>
  </g>

  <!-- 4. 【可视化与代码结合】优雅墨线绘制的思维演进分叉树 (The Branching Tree) -->
  <g stroke="#18181B" stroke-linecap="round" stroke-linejoin="round">
    <!-- 垂直主干 (已确认共识事实) -->
    <line x1="400" y1="480" x2="400" y2="280" stroke-width="3"/>
    
    <!-- 侧向分支 A (Agent 探索提议) -->
    <path d="M 400 420 C 400 370, 330 380, 320 310" fill="none" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="320" cy="310" r="4" fill="#FCFAF6" stroke="#18181B" stroke-width="2"/>

    <!-- 侧向分支 B (Agent 验证提议) -->
    <path d="M 400 370 C 400 330, 470 340, 480 290" fill="none" stroke-width="2"/>
    <circle cx="480" cy="290" r="4" fill="#18181B"/>
  </g>

  <!-- 5. 【注意力集中与助手】正北朱砂火漆印鉴 (The Vermilion Seal & Needle) -->
  <!-- 罗盘指针直指北方，北针顶端盖着一枚鲜红的“事实确证”火漆印章 -->
  <g filter="url(#sealEmboss)">
    <!-- 锐利立体古典墨色指南针针头 -->
    <polygon points="400,240 388,320 400,310" fill="#18181B"/>
    <polygon points="400,240 400,310 412,320" fill="#3F3F46"/>

    <!-- 盖在真理北方的朱砂火漆印章 (直径 52px) -->
    <circle cx="400" cy="240" r="26" fill="url(#waxSealGrad)"/>
    <!-- 火漆印边缘微凹凸不规则压痕 -->
    <circle cx="400" cy="240" r="21" fill="none" stroke="#FCA5A5" stroke-width="1.5" opacity="0.6"/>
    
    <!-- 印章内部图腾：古典星标/小绿勾的朱砂雕刻印 `✦` -->
    <text x="400" y="247" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#FFFFFF">✦</text>
  </g>

  <!-- 6. 底部典雅手写人文排版 -->
  <text x="400" y="670" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Cinzel', Georgia, serif" 
        font-size="26" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#18181B">COMPASS</text>
        
  <text x="400" y="700" 
        text-anchor="middle" 
        font-family="'Geist Mono', 'Courier New', monospace" 
        font-size="11" 
        letter-spacing="3" 
        fill="#71717A">AN EDITORIAL COMPASS FOR CODING AGENTS</text>
</svg>
