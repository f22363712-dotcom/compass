<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- 典雅深色背景：带有古典人文纸墨微质感 (Dark Parchment & Charcoal Slate) -->
    <radialGradient id="humanistBg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="60%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#06070a"/>
    </radialGradient>

    <!-- 典雅象牙金与星辉渐变 (Ivory Gold to Celestial Starlight) -->
    <linearGradient id="trunkGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="40%" stop-color="#60a5fa"/>
      <stop offset="85%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="branchGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(96, 165, 250, 0.4)"/>
      <stop offset="70%" stop-color="rgba(224, 231, 255, 0.85)"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- 知识节点微光辉光滤镜 -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="gentleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- 1. 画布基底 -->
  <rect width="800" height="800" fill="url(#humanistBg)"/>

  <!-- 2. 文艺复兴手稿辅助同心圆与黄金分割线 (达芬奇/开普勒古典理性手稿风格，5% 透明度) -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" stroke-dasharray="3 6">
    <circle cx="400" cy="400" r="280" fill="none"/>
    <circle cx="400" cy="400" r="180" fill="none"/>
    <circle cx="400" cy="400" r="90" fill="none"/>
    <line x1="400" y1="100" x2="400" y2="700"/>
    <line x1="120" y1="400" x2="680" y2="400"/>
  </g>

  <!-- 3. 核心图腾：认知演进拓扑树 (The Epistemic Tree) -->
  <g filter="url(#gentleShadow)">
    
    <!-- 主干基石 (The Ground Truth Trunk) : 代表人类已审核通过的坚固团队共识主轴 -->
    <!-- 从底部 (400, 580) 笔直向上扎根延伸至分叉枢纽 (400, 380) -->
    <line x1="400" y1="580" x2="400" y2="380" stroke="url(#trunkGrad)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- 底部基准锚点：实心同心环基石 -->
    <circle cx="400" cy="580" r="10" fill="#0b0e14" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="400" cy="580" r="4" fill="#ffffff"/>

    <!-- 拓扑分叉 1 (左侧分支 · Agent A 探索路径) : 优雅的三次贝塞尔曲线 -->
    <path d="M 400 380 C 400 300, 260 320, 250 230" 
          fill="none" 
          stroke="url(#branchGrad)" 
          stroke-width="2" 
          stroke-linecap="round"/>

    <!-- 拓扑分叉 2 (中央主航道 · 核心演进主干) : 笔直穿透至巅峰 -->
    <line x1="400" y1="380" x2="400" y2="200" stroke="url(#trunkGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 拓扑分叉 3 (右侧分支 · Agent B 探索路径) : 贝塞尔对称优雅分叉 -->
    <path d="M 400 380 C 400 300, 540 320, 550 230" 
          fill="none" 
          stroke="url(#branchGrad)" 
          stroke-width="2" 
          stroke-linecap="round"/>

    <!-- 次级分叉 (从中央向左右微发散的二次推演线，表现思维深度) -->
    <path d="M 400 290 C 370 270, 330 270, 320 220" fill="none" stroke="rgba(224, 231, 255, 0.45)" stroke-width="1.2" stroke-dasharray="2 3"/>
    <path d="M 400 290 C 430 270, 470 270, 480 220" fill="none" stroke="rgba(224, 231, 255, 0.45)" stroke-width="1.2" stroke-dasharray="2 3"/>
  </g>

  <!-- 4. 节点果实：真理星芒与引文锚点 (The Nodes of Truth) -->
  <g filter="url(#starGlow)">
    <!-- 中央主节点星芒 (400, 200) : 终局共识节点 -->
    <circle cx="400" cy="200" r="6" fill="#ffffff"/>
    <circle cx="400" cy="200" r="14" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>
    <!-- 十字微芒 -->
    <line x1="400" y1="180" x2="400" y2="220" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
    <line x1="380" y1="200" x2="420" y2="200" stroke="#ffffff" stroke-width="1" opacity="0.9"/>

    <!-- 左侧节点 (250, 230) : 待采纳事实提议 -->
    <circle cx="250" cy="230" r="4.5" fill="#93c5fd"/>
    <circle cx="250" cy="230" r="9" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>

    <!-- 右侧节点 (550, 230) : 经过验证的测试凭据 -->
    <circle cx="550" cy="230" r="4.5" fill="#93c5fd"/>
    <circle cx="550" cy="230" r="9" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>

    <!-- 中央分叉枢纽点 (400, 380) : 人类决断时刻 (Triage Gateway) -->
    <circle cx="400" cy="380" r="5" fill="#ffffff"/>
  </g>

  <!-- 5. 典雅古典衬线排版 (人文主义古典碑铭与现代极客字体结合) -->
  <text x="400" y="670" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Trajan Pro', 'Didot', 'Georgia', 'Playfair Display', serif" 
        font-size="20" 
        font-weight="400" 
        letter-spacing="10" 
        fill="#f8fafc" 
        opacity="0.92">E P I S T E M E</text>
        
  <text x="400" y="700" 
        text-anchor="middle" 
        font-family="'Geist Mono', 'Inter', monospace" 
        font-size="10" 
        letter-spacing="4" 
        fill="rgba(224, 231, 255, 0.45)">THE COGNITIVE TREE OF TRUTH · DECISION TOPOLOGY</text>
</svg>
