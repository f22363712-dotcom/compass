<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- 深邃炭黑极客背景 -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="60%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#020203"/>
    </radialGradient>

    <!-- 日出荧光橘渐变 (Electric Orange) -->
    <linearGradient id="orangeNeedleDark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="60%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <!-- 阳光柠檬黄 (Lemon Yellow) -->
    <linearGradient id="yellowConeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <!-- 朱砂红真理印鉴渐变 -->
    <radialGradient id="vermilionSealDark" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </radialGradient>

    <!-- 暗黑模式下的跑车级微光硬投影 -->
    <filter id="darkGlowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FF5500" flood-opacity="0.15"/>
    </filter>

    <filter id="sealGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#EF4444" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. 深炭黑背景 -->
  <rect width="800" height="800" fill="url(#darkBg)"/>

  <!-- 2. 暗黑工程坐标参考线 (极细微暗灰) -->
  <g stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2">
    <line x1="80" y1="380" x2="720" y2="380"/>
    <line x1="400" y1="80" x2="400" y2="680"/>
    <line x1="220" y1="200" x2="580" y2="560" stroke-dasharray="4 6"/>
    <line x1="580" y1="200" x2="220" y2="560" stroke-dasharray="4 6"/>
  </g>

  <!-- 3. 核心包豪斯色盘组件 (暗黑版高反差) -->
  <g filter="url(#darkGlowShadow)">
    
    <!-- 底盘：纯黑圆盘 (直径 380px，带微高光纯白描边) -->
    <circle cx="400" cy="380" r="190" fill="#09090B" stroke="#27272A" stroke-width="4"/>

    <!-- 1/2 纯净象牙白半圆切块 (西半球：高反差雪白) -->
    <path d="M 400 380 L 210 380 A 190 190 0 0 1 400 190 Z" fill="#F4F4F5"/>
    <path d="M 400 380 L 210 380 A 190 190 0 0 0 400 570 Z" fill="#E4E4E7"/>

    <!-- 1/4 阳光柠檬黄扇区 (东北象限：高能聚焦视锥) -->
    <path d="M 400 380 L 400 190 A 190 190 0 0 1 590 380 Z" fill="url(#yellowConeDark)"/>
    
    <!-- 聚焦扇区内部的微雷达刻度线 -->
    <path d="M 400 380 L 400 280 A 100 100 0 0 1 500 380 Z" fill="none" stroke="#09090B" stroke-width="2" stroke-dasharray="3 5"/>
    <circle cx="470" cy="310" r="4" fill="#09090B"/>
    <text x="510" y="275" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#09090B">0.15s</text>
  </g>

  <!-- 4. 罗盘微米刻度与经纬标记 -->
  <g stroke="#FFFFFF" stroke-linecap="round">
    <!-- 正北标尺 (N) -->
    <line x1="400" y1="120" x2="400" y2="155" stroke-width="4"/>
    <text x="400" y="105" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">N</text>
    
    <!-- 东 (E)、南 (S)、西 (W) 精密标尺 -->
    <line x1="645" y1="380" x2="620" y2="380" stroke-width="3" stroke="#A1A1AA"/>
    <text x="665" y="385" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="#A1A1AA">E</text>

    <line x1="400" y1="640" x2="400" y2="615" stroke-width="3" stroke="#A1A1AA"/>
    <text x="400" y="665" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="#A1A1AA">S</text>

    <line x1="155" y1="380" x2="180" y2="380" stroke-width="3" stroke="#A1A1AA"/>
    <text x="135" y="385" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="#A1A1AA">W</text>
  </g>

  <!-- 5. 【指南核心】暗黑高光真北指针 -->
  <g>
    <!-- 北针左切面：高能荧光橘 -->
    <polygon points="400,140 365,380 400,345" fill="url(#orangeNeedleDark)" stroke="#09090B" stroke-width="3"/>
    <!-- 北针右切面：暗橙立体切面 -->
    <polygon points="400,140 400,345 435,380" fill="#C2410C" stroke="#09090B" stroke-width="3"/>

    <!-- 南针稳定块：深灰与炭黑配重 -->
    <polygon points="400,500 375,380 400,400" fill="#3F3F46" stroke="#09090B" stroke-width="3"/>
    <polygon points="400,500 400,400 425,380" fill="#27272A" stroke="#09090B" stroke-width="3"/>
  </g>

  <!-- 6. 【轴心朱砂真理火漆印 (The Vermilion Seal ✦)】 -->
  <g filter="url(#sealGlow)">
    <!-- 外层深黑圈，带高反差纯白外描边 -->
    <circle cx="400" cy="380" r="34" fill="#09090B" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- 朱砂红实心印 -->
    <circle cx="400" cy="380" r="23" fill="url(#vermilionSealDark)"/>
    
    <!-- 纯白星芒 `✦` -->
    <text x="400" y="387" text-anchor="middle" font-family="'Inter', serif" font-size="20" font-weight="800" fill="#FFFFFF">✦</text>
  </g>

  <!-- 7. 底部排版 -->
  <text x="400" y="720" 
        text-anchor="middle" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="32" 
        font-weight="900" 
        letter-spacing="6" 
        fill="#FFFFFF">COMPASS</text>
        
  <text x="400" y="750" 
        text-anchor="middle" 
        font-family="'Geist Mono', monospace" 
        font-size="12" 
        font-weight="700" 
        letter-spacing="4" 
        fill="#FF5500">THE LIVING EVIDENCE COMPASS FOR CODING AGENTS</text>
</svg>
