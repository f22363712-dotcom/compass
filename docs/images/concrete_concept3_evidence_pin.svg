<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- 背景 -->
    <radialGradient id="pinBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="65%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>

    <!-- 证据图钉渐变 -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- 雷达微扫光渐变 -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.25)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0)"/>
    </linearGradient>

    <filter id="evidenceGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. 背景 -->
  <rect width="800" height="800" fill="url(#pinBg)"/>

  <!-- 2. 雷达对焦瞄准镜 (The Radar Scope) -->
  <g>
    <!-- 外雷达圆 -->
    <circle cx="400" cy="380" r="210" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>
    <circle cx="400" cy="380" r="140" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="400" cy="380" r="70" fill="none" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1.2"/>

    <!-- 十字准星标尺 (Crosshairs) -->
    <line x1="160" y1="380" x2="310" y2="380" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
    <line x1="490" y1="380" x2="640" y2="380" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
    <line x1="400" y1="140" x2="400" y2="290" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
    <line x1="400" y1="470" x2="400" y2="620" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>

    <!-- 四角精密取景切角 (L-brackets) -->
    <path d="M 230 250 L 210 250 L 210 270" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
    <path d="M 570 250 L 590 250 L 590 270" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
    <path d="M 230 510 L 210 510 L 210 490" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
    <path d="M 570 510 L 590 510 L 590 490" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
  </g>

  <!-- 3. 核心具象：证据图钉与代码标签 (The Code Evidence Pin & Tag) -->
  <g filter="url(#evidenceGlow)">
    
    <!-- 0.15s 悬停气泡波纹微光 (Popover Aura) -->
    <circle cx="400" cy="380" r="52" fill="rgba(59, 130, 246, 0.12)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5"/>

    <!-- 居中的代码事实徽章 (Fact Badge Pill) -->
    <rect x="330" y="356" width="140" height="48" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- 徽章内的代码字样：[#] 证据 ID 符号 -->
    <text x="400" y="388" 
          text-anchor="middle" 
          font-family="'Geist Mono', monospace" 
          font-size="16" 
          font-weight="700" 
          fill="#38bdf8">&lt;evidence/&gt;</text>

    <!-- 精密定位图钉的下探针尖 (Pin Needle) -->
    <polygon points="394,404 406,404 400,434" fill="#38bdf8"/>
    <circle cx="400" cy="438" r="3" fill="#ffffff"/>
  </g>

  <!-- 4. 底部文字 -->
  <text x="400" y="670" 
        text-anchor="middle" 
        font-family="'Inter', sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#f8fafc">PINPOINT</text>
        
  <text x="400" y="700" 
        text-anchor="middle" 
        font-family="'Geist Mono', monospace" 
        font-size="11" 
        letter-spacing="2" 
        fill="#94a3b8">PRECISION EVIDENCE FOR CODING AGENTS</text>
</svg>
