<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <radialGradient id="prismBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="60%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#020306"/>
    </radialGradient>

    <!-- 可视化显影图谱渐变 -->
    <linearGradient id="visualSpectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- 准星聚光渐变 -->
    <radialGradient id="apertureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="rgba(37, 99, 235, 0.25)"/>
      <stop offset="100%" stop-color="rgba(37, 99, 235, 0)"/>
    </radialGradient>

    <!-- 辉光滤镜 -->
    <filter id="scopeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="lensShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- 1. 背景 -->
  <rect width="800" height="800" fill="url(#prismBg)"/>

  <!-- 2. 【发展历史体现】双层罗盘环 (Dual Evolution Rings)
       内层小环：代表最初奠定的核心基石 (Personal View vs Team Truth)
       外层大环：代表 M1(流式观察者)/M2(PRD双向导出)/M3(原生MCP封装)的现代工业闭环 -->
  <g filter="url(#lensShadow)">
    <!-- 外层现代生态大环 (半径 220) -->
    <circle cx="400" cy="380" r="220" fill="#090d16" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
    <circle cx="400" cy="380" r="216" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" stroke-dasharray="2 6"/>

    <!-- 内层初始基石小环 (半径 150) -->
    <circle cx="400" cy="380" r="150" fill="#0d1322" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5"/>

    <!-- 历史里程碑四大锚点 (M1, M2, M3, 407 Tests) -->
    <circle cx="180" cy="380" r="4" fill="#38bdf8"/>
    <circle cx="620" cy="380" r="4" fill="#38bdf8"/>
    <circle cx="400" cy="600" r="4" fill="#38bdf8"/>
    <circle cx="400" cy="160" r="4" fill="#ffffff"/>
  </g>

  <!-- 3. 【可视化体现】透镜内部显影的 Canvas 贝塞尔拓扑图谱 (The Rendered Topology) -->
  <g filter="url(#scopeGlow)">
    <!-- 拓扑演进流线：贯穿内环，展现决策演进脉络 -->
    <path d="M 300 440 C 350 430, 360 350, 400 350 C 440 350, 460 410, 500 370" 
          fill="none" 
          stroke="url(#visualSpectrum)" 
          stroke-width="3" 
          stroke-linecap="round"/>

    <!-- 演进分支节点 (Commit/Fact Nodes) -->
    <circle cx="300" cy="440" r="5" fill="#38bdf8"/>
    <circle cx="400" cy="350" r="7" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
    <circle cx="500" cy="370" r="6" fill="#34d399"/>
  </g>

  <!-- 4. 【注意力集中体现】精密光学十字准星与 0.15s 悬停焦点 (Focus Crosshair) -->
  <g>
    <!-- 十字准星线：从外环贯穿至焦点边界，把目光强力导向中心 -->
    <line x1="260" y1="380" x2="350" y2="380" stroke="#38bdf8" stroke-width="2"/>
    <line x1="450" y1="380" x2="540" y2="380" stroke="#38bdf8" stroke-width="2"/>
    <line x1="400" y1="240" x2="400" y2="330" stroke="#38bdf8" stroke-width="2"/>
    <line x1="400" y1="430" x2="400" y2="520" stroke="#38bdf8" stroke-width="2"/>

    <!-- 中心超清高亮聚光镜 (Aperture Eye) -->
    <circle cx="400" cy="380" r="32" fill="url(#apertureGlow)" opacity="0.6"/>
    <circle cx="400" cy="380" r="22" fill="#070a12" stroke="#ffffff" stroke-width="2"/>
    <circle cx="400" cy="380" r="6" fill="#38bdf8"/>
  </g>

  <!-- 5. 【助手与指南体现】终端伴生提示符 `>` 与 `_` + 罗盘正北真理指针 (Assistant Cursor & True North) -->
  <g>
    <!-- 助手元素：准星视窗左侧的代码光标提示符 `>` (Terminal Prompt Cursor)，象征 Agent 随时协同 -->
    <path d="M 320 370 L 335 380 L 320 390" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 助手元素：准星视窗右侧的待命光标闪烁短横 `_` -->
    <line x1="465" y1="388" x2="480" y2="388" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 指南核心：外圈正北方的锐利立体罗盘北向指针 (North Needle) -->
    <polygon points="400,140 388,180 412,180" fill="#ffffff" filter="url(#scopeGlow)"/>
    <polygon points="400,140 400,180 412,180" fill="#0284c7"/>
    <text x="400" y="125" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">TRUE NORTH</text>
  </g>

  <!-- 6. 底部文字 -->
  <text x="400" y="660" 
        text-anchor="middle" 
        font-family="'Inter', sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#f8fafc">COMPASS · PRISM</text>
        
  <text x="400" y="690" 
        text-anchor="middle" 
        font-family="'Geist Mono', monospace" 
        font-size="11" 
        letter-spacing="2" 
        fill="#94a3b8">RADAR LENS · CODE TOPOLOGY · TRUE NORTH</text>
</svg>
