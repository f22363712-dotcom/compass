<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- 深邃古籍典雅背景 -->
    <radialGradient id="exeBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#121620"/>
      <stop offset="65%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#040507"/>
    </radialGradient>

    <!-- 考据星标高光渐变 -->
    <linearGradient id="asteriskGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#bfdbfe"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- 文本羊皮卷基底渐变 (引文悬停卡片隐喻) -->
    <linearGradient id="citationCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>

    <!-- 星标发光滤镜 -->
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- 1. 背景 -->
  <rect width="800" height="800" fill="url(#exeBg)"/>

  <!-- 2. 天体天文微经纬线 (17世纪伽利略与开普勒手稿微刻度) -->
  <g stroke="rgba(255, 255, 255, 0.035)" stroke-width="1">
    <circle cx="400" cy="340" r="220" fill="none" stroke-dasharray="2 4"/>
    <circle cx="400" cy="340" r="140" fill="none"/>
    <circle cx="400" cy="340" r="70" fill="none" stroke-dasharray="4 8"/>
    <!-- 对角线切线 -->
    <line x1="240" y1="180" x2="560" y2="500" stroke-dasharray="4 4"/>
    <line x1="560" y1="180" x2="240" y2="500" stroke-dasharray="4 4"/>
  </g>

  <!-- 3. 下方原文引文卡片 (The Cited Ground Truth) : 直观呈现 0.15s 悬停透视卡片 -->
  <g filter="url(#cardShadow)">
    <rect x="250" y="470" width="300" height="110" rx="8" 
          fill="url(#citationCardGrad)" 
          stroke="rgba(255, 255, 255, 0.12)" 
          stroke-width="1.2"/>
    
    <!-- 模拟卡片内发丝引文文本行 (古籍/代码行隐喻) -->
    <line x1="280" y1="500" x2="430" y2="500" stroke="rgba(255, 255, 255, 0.55)" stroke-width="2" stroke-linecap="round"/>
    <line x1="280" y1="520" x2="520" y2="520" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="280" y1="540" x2="490" y2="540" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="280" y1="560" x2="380" y2="560" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/> <!-- 绿色/蓝色高亮凭据行 -->
  </g>

  <!-- 4. 垂直引文追溯垂线 (The Thread of Citation) : 从星标笔直垂入卡片核心 -->
  <line x1="400" y1="340" x2="400" y2="470" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="400" cy="470" r="3" fill="#ffffff"/>

  <!-- 5. 核心图腾：考据溯源星标 (The Exegetical Asterisk ✦) -->
  <g filter="url(#beaconGlow)">
    <!-- 四角主星芒 (古典文献学中的纯正八角星标) -->
    <!-- 垂直主芒 -->
    <path d="M 400 240 Q 400 340 370 340 Q 400 340 400 440 Q 400 340 430 340 Q 400 340 400 240 Z" 
          fill="url(#asteriskGleam)"/>
    <!-- 水平主芒 -->
    <path d="M 300 340 Q 400 340 400 310 Q 400 340 500 340 Q 400 340 400 370 Q 400 340 300 340 Z" 
          fill="url(#asteriskGleam)"/>
    <!-- 斜向 45 度副芒 -->
    <path d="M 330 270 Q 400 340 380 320 Q 400 340 470 410 Q 400 340 420 360 Q 400 340 330 270 Z" 
          fill="#bfdbfe" opacity="0.8"/>
    <path d="M 470 270 Q 400 340 420 320 Q 400 340 330 410 Q 400 340 380 360 Q 400 340 470 270 Z" 
          fill="#bfdbfe" opacity="0.8"/>

    <!-- 星芯纯白超新星能量点 -->
    <circle cx="400" cy="340" r="5" fill="#ffffff"/>
  </g>

  <!-- 6. 底部典雅铭文 -->
  <text x="400" y="670" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Georgia', 'Playfair Display', serif" 
        font-size="20" 
        font-weight="400" 
        letter-spacing="10" 
        fill="#f8fafc" 
        opacity="0.92">A P O D I X</text>
        
  <text x="400" y="700" 
        text-anchor="middle" 
        font-family="'Geist Mono', 'Inter', monospace" 
        font-size="10" 
        letter-spacing="4" 
        fill="rgba(224, 231, 255, 0.45)">THE UNCONCEALED CITATION · EXPLANATORY BEACON</text>
</svg>
