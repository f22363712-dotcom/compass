<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- 背景：深色暗夜极客代码背景 -->
    <radialGradient id="codeBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- 罗盘外环金属质感 -->
    <linearGradient id="dialRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- 北针高亮：代表团队确证事实的冷蓝到亮白 -->
    <linearGradient id="needleNorth" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- 南针：次级暗灰（代表回溯历史上下文） -->
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="60%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <!-- 发光微滤镜 -->
    <filter id="needleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dialShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- 1. 背景 -->
  <rect width="800" height="800" fill="url(#codeBg)"/>

  <!-- 2. 罗盘主体仪表盘 (The Compass Dial) -->
  <g filter="url(#dialShadow)">
    <!-- 外层精密刻度环 -->
    <circle cx="400" cy="380" r="210" fill="url(#dialRim)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
    <circle cx="400" cy="380" r="195" fill="#0b0f17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

    <!-- 罗盘四方位精准刻度线 (N / E / S / W) -->
    <!-- 北 (N) 标刻线 -->
    <line x1="400" y1="190" x2="400" y2="215" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <text x="400" y="235" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="13" font-weight="700" fill="#38bdf8">N</text>

    <!-- 南 (S) 标刻线 -->
    <line x1="400" y1="570" x2="400" y2="545" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
    <text x="400" y="535" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="12" fill="rgba(255,255,255,0.4)">S</text>

    <!-- 东 (E) 标刻线 -->
    <line x1="610" y1="380" x2="585" y2="380" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
    <text x="575" y="384" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="12" fill="rgba(255,255,255,0.4)">E</text>

    <!-- 西 (W) 标刻线 -->
    <line x1="190" y1="380" x2="215" y2="380" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
    <text x="225" y="384" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="12" fill="rgba(255,255,255,0.4)">W</text>

    <!-- 盘面发丝细密角度刻度圈 (360度点状刻度) -->
    <circle cx="400" cy="380" r="165" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" stroke-dasharray="3 11"/>
  </g>

  <!-- 3. 核心指针：代码括号融合磁针 (The Code Bracket Needle) -->
  <!-- 上半指针由代码尖括号融合而成，直指正北方 -->
  <g filter="url(#needleGlow)">
    
    <!-- 北针：左半棱角与右半棱角（立体反光棱锥） -->
    <!-- 左半面 -->
    <path d="M 400 230 L 400 380 L 368 380 Z" fill="url(#needleNorth)"/>
    <!-- 右半面 (带稍暗阴影，塑造立体金属折面) -->
    <path d="M 400 230 L 432 380 L 400 380 Z" fill="#0284c7"/>

    <!-- 南针：指向南方历史记录 -->
    <!-- 左半面 -->
    <path d="M 400 530 L 372 380 L 400 380 Z" fill="url(#needleSouth)"/>
    <!-- 右半面 -->
    <path d="M 400 530 L 400 380 L 428 380 Z" fill="#1e293b"/>

    <!-- 指针中心轴心：代码大括号/锚点轮廓 -->
    <circle cx="400" cy="380" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="400" cy="380" r="8" fill="#ffffff"/>
  </g>

  <!-- 4. 具象代码元素：左右对称的代码括号 `<` 与 `>`，守护罗盘两侧 -->
  <!-- 左代码尖括号 < -->
  <path d="M 330 350 L 300 380 L 330 410" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 右代码尖括号 > -->
  <path d="M 470 350 L 500 380 L 470 410" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 5. 底部品牌文字：直白纯粹 -->
  <text x="400" y="670" 
        text-anchor="middle" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#f8fafc">COMPASS</text>
        
  <text x="400" y="700" 
        text-anchor="middle" 
        font-family="'Geist Mono', monospace" 
        font-size="11" 
        letter-spacing="2" 
        fill="#94a3b8">THE EVIDENCE COMPASS FOR CODING AGENTS</text>
</svg>
