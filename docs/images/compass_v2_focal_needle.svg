<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- 背景渐变：深邃深空墨蓝 -->
    <radialGradient id="focalBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="60%" stop-color="#080d17"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- 聚光光锥与注意力集中渐变 (Convergence Cone) -->
    <linearGradient id="focusConeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(37, 99, 235, 0)"/>
      <stop offset="40%" stop-color="rgba(59, 130, 246, 0.15)"/>
      <stop offset="85%" stop-color="rgba(56, 189, 248, 0.45)"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- 罗盘北针立体光泽 (True North Needle) -->
    <linearGradient id="needleNorthGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- 助手伴生光弧渐变 (The Assistant Companion Arc) -->
    <linearGradient id="companionArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- 发展历史渐变外环：从早期的离散虚线点演进到现在的凝实发光实体 -->
    <linearGradient id="historyRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.1)"/>
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.4)"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- 辉光滤镜 -->
    <filter id="focusGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- 1. 背景 -->
  <rect width="800" height="800" fill="url(#focalBg)"/>

  <!-- 2. 【发展历史体现】外围演进时间环：左下(早期探索点状) -> 顺时针 -> 顶部(成熟权威实线) -->
  <g>
    <!-- 早期阶段（7点到10点钟方向）：离散虚线，象征项目初期的日志收集与探索分歧 -->
    <path d="M 240 500 A 210 210 0 0 1 195 350" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="3 8"/>
    <!-- 中期阶段（10点到1点钟方向）：虚实交织，象征M1/M2实时流与双向PRD闭环 -->
    <path d="M 195 350 A 210 210 0 0 1 400 170" fill="none" stroke="url(#historyRingGrad)" stroke-width="2.5" stroke-dasharray="8 6"/>
    <!-- 现今阶段（1点到5点钟方向）：407项测试全绿的凝固高亮实线 -->
    <path d="M 400 170 A 210 210 0 0 1 605 350" fill="none" stroke="url(#historyRingGrad)" stroke-width="3"/>
    
    <!-- 罗盘方位微刻度 (N / S / W / E) -->
    <line x1="400" y1="150" x2="400" y2="165" stroke="#38bdf8" stroke-width="3"/>
    <text x="400" y="140" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="13" font-weight="700" fill="#38bdf8">N · TRUE NORTH</text>
  </g>

  <!-- 3. 【可视化体现】中心 Canvas 贝塞尔拓扑网格底纹 (代表思维演进树) -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.2">
    <circle cx="400" cy="380" r="140" fill="none"/>
    <path d="M 280 440 C 340 400, 360 420, 400 380 C 440 340, 480 370, 520 320" fill="none" stroke-dasharray="3 5"/>
    <circle cx="280" cy="440" r="3" fill="#60a5fa" opacity="0.4"/>
    <circle cx="520" cy="320" r="3" fill="#60a5fa" opacity="0.4"/>
  </g>

  <!-- 4. 【注意力集中体现】聚焦光锥与中心微透镜 (Focus Aperture & Convergence) -->
  <g filter="url(#focusGlow)">
    <!-- 从四周向中心 400,380 汇聚的光束锥体：把海量上下文压缩进关键决策 -->
    <polygon points="320,530 480,530 400,380" fill="url(#focusConeGrad)"/>
    
    <!-- 核心光圈聚焦点：0.15s 悬停透视眼 (The 0.15s Focus Point) -->
    <circle cx="400" cy="380" r="28" fill="#0b0f19" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="400" cy="380" r="22" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="400" cy="380" r="6" fill="#ffffff"/>
  </g>

  <!-- 5. 【助手与指南体现】伴生光弧 + 罗盘北针 (The Assistant Companion & Compass Needle) -->
  <g filter="url(#mainShadow)">
    
    <!-- 助手元素：左侧轻柔环绕的“伴生智能翼” (The Assistant Arc)，像一位在侧翼提供支持的伙伴 -->
    <path d="M 330 460 C 290 400, 290 320, 340 270" 
          fill="none" 
          stroke="url(#companionArcGrad)" 
          stroke-width="3" 
          stroke-linecap="round"/>
    <!-- 助手活跃状态指示点 -->
    <circle cx="340" cy="270" r="4" fill="#c084fc"/>

    <!-- 指南核心：从聚焦点笔直升起的立体罗盘北针 (The True North Needle) -->
    <!-- 左反光面 -->
    <polygon points="400,190 400,380 375,380" fill="url(#needleNorthGrad)"/>
    <!-- 右反光面 (暗调立体切面) -->
    <polygon points="400,190 425,380 400,380" fill="#0369a1"/>

    <!-- 南向平衡尾翼 (稳定锚点) -->
    <polygon points="400,470 384,380 400,380" fill="#475569"/>
    <polygon points="400,470 400,380 416,380" fill="#1e293b"/>
  </g>

  <!-- 6. 底部排版 -->
  <text x="400" y="660" 
        text-anchor="middle" 
        font-family="'Inter', sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#f8fafc">COMPASS · FOCAL</text>
        
  <text x="400" y="690" 
        text-anchor="middle" 
        font-family="'Geist Mono', monospace" 
        font-size="11" 
        letter-spacing="2" 
        fill="#94a3b8">ASSISTANT · FOCUS · VISUALIZATION · GUIDANCE</text>
</svg>
