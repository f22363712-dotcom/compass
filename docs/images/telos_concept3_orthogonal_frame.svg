<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- 深空微偏蓝墨黑底色渐变 -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f131a"/>
      <stop offset="60%" stop-color="#07080a"/>
      <stop offset="100%" stop-color="#030405"/>
    </radialGradient>

    <!-- 主框架（人类意图侧）：阳极氧化深钛金属渐变 -->
    <linearGradient id="titaniumMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#323846"/>
      <stop offset="35%" stop-color="#20242e"/>
      <stop offset="70%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#0e1014"/>
    </linearGradient>

    <!-- 从框架（Agent 执行侧）：略显收敛的暗钛金属渐变 -->
    <linearGradient id="titaniumSub" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#282d38"/>
      <stop offset="40%" stop-color="#191c24"/>
      <stop offset="80%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </linearGradient>

    <!-- 0.2mm 精密切割倒角高光 -->
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)"/>
      <stop offset="30%" stop-color="rgba(255, 255, 255, 0.12)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- 480nm 冷钴蓝激光定基点光晕 -->
    <radialGradient id="laserCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#60a5fa"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="85%" stop-color="rgba(59, 130, 246, 0.25)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0)"/>
    </radialGradient>

    <!-- 柔和接触阴影 -->
    <filter id="industrialShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- 微微发光滤镜 -->
    <filter id="datumGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. 哑光深空画布背景 -->
  <rect width="800" height="800" fill="url(#bgGlow)"/>

  <!-- 2. 瑞士网格微妙微参考发丝线 (5% 透明度) -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" stroke-dasharray="4 8">
    <line x1="160" y1="400" x2="640" y2="400"/>
    <line x1="400" y1="160" x2="400" y2="640"/>
    <circle cx="400" cy="400" r="240" fill="none"/>
  </g>

  <!-- 3. 核心几何组 (含阴影) -->
  <g filter="url(#industrialShadow)">
    
    <!-- 主框架 (人类意图侧 · 左上方 L 构件) : 强调绝对边界与规格定义 -->
    <!-- 外轮廓: (240, 240) -> (500, 240) -> (500, 310) -> (310, 310) -> (310, 500) -> (240, 500) -> 闭合 -->
    <path d="M 240 240 L 510 240 L 510 316 L 320 316 L 320 510 L 240 510 Z" 
          fill="url(#titaniumMain)" 
          stroke="url(#specularRim)" 
          stroke-width="1.5"
          stroke-linejoin="miter"/>
    
    <!-- 主框架微雕游标凹槽 (Sub-micron Datum Notch) -->
    <line x1="320" y1="240" x2="320" y2="260" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <line x1="240" y1="320" x2="260" y2="320" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

    <!-- 从框架 (Agent 执行侧 · 右下方反向 L 构件) : 强调概率生成但受限于契约 -->
    <!-- 与主框架保持严密的 48px (8pt 网格倍数) 呼吸缝隙 -->
    <!-- 外轮廓: (560, 560) -> (290, 560) -> (290, 484) -> (480, 484) -> (480, 290) -> (560, 290) -> 闭合 -->
    <path d="M 560 560 L 290 560 L 290 484 L 480 484 L 480 290 L 560 290 Z" 
          fill="url(#titaniumSub)" 
          stroke="url(#specularRim)" 
          stroke-width="1.2"
          stroke-linejoin="miter"/>
    
    <!-- 从框架微雕游标刻度 -->
    <line x1="480" y1="560" x2="480" y2="540" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <line x1="560" y1="480" x2="540" y2="480" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  </g>

  <!-- 4. 核心定基点：480nm 冷蓝激光锚点 (The Datum Anchor) -->
  <!-- 悬浮在两个构件交错对峙的黄金负空间中央 (400, 400) -->
  <g filter="url(#datumGlow)">
    <!-- 扩散微光晕 -->
    <circle cx="400" cy="400" r="28" fill="url(#laserCore)" opacity="0.85"/>
    <!-- 极细高光十字准星发丝 (0.8px) -->
    <line x1="382" y1="400" x2="418" y2="400" stroke="#60a5fa" stroke-width="1.2" opacity="0.9"/>
    <line x1="400" y1="382" x2="400" y2="418" stroke="#60a5fa" stroke-width="1.2" opacity="0.9"/>
    <!-- 纯白致密能量实心点 -->
    <circle cx="400" cy="400" r="3.5" fill="#ffffff"/>
  </g>

  <!-- 5. 底部极简工业工程标注 (Helvetica/Inter Monospace 风格) -->
  <text x="400" y="670" 
        text-anchor="middle" 
        font-family="'Geist Mono', 'SF Mono', 'JetBrains Mono', monospace" 
        font-size="14" 
        font-weight="600" 
        letter-spacing="6" 
        fill="#ffffff" 
        opacity="0.85">TELOS</text>
        
  <text x="400" y="694" 
        text-anchor="middle" 
        font-family="'Geist Mono', monospace" 
        font-size="10" 
        letter-spacing="3" 
        fill="rgba(255, 255, 255, 0.35)">THE PURPOSE ENGINE · ORTHOGONAL FRAME</text>
</svg>
