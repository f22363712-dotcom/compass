# Smithery configuration for Project Compass
# https://smithery.ai/docs/config

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      projectPath:
        type: string
        description: "Path to the local repository directory being governed"
        default: "."
  commandFunction: |-
    (config) => ({
      command: 'uvx',
      args: [
        '--from',
        'project-compass',
        'compass-mcp',
        '--project-path',
        config.projectPath || '.'
      ]
    })
