<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compass 工作台</title>
<style>:root {
  --paper: #F4F3EE;
  --surface: #FFFFFF;
  --surface-alt: #EBE9E2;
  --surface-subtle: #E5E2D8;
  --navy: #090D16;
  --ink: #090D16;
  --ink-inverse: #F8FAFC;
  --muted: #475569;
  --line: #CBD5E1;
  --line-strong: #090D16;
  --orange: #FF5500;
  --orange-ink: #B83B00;
  --ok-ink: #14532D;
  --ok-bg: #DCFCE7;
  --ok-border: #166534;
  --danger-ink: #991B1B;
  --danger-bg: #FEE2E2;
  --danger-border: #B91C1C;
  --warn-ink: #92400E;
  --warn-bg: #FEF9C3;
  --warn-border: #A16207;
  --info-ink: #1E3A8A;
  --info-bg: #DBEAFE;
  --info-border: #1D4ED8;
  --shadow-focus: 3px 3px 0 0 var(--navy);
  --shadow-orange: 3px 3px 0 0 var(--orange);
  --radius: 2px;
  --bg-app: var(--paper);
  --bg-card: var(--surface);
  --bg-sub: var(--surface-alt);
  --fg-main: var(--ink);
  --fg-muted: var(--muted);
  --bd-subtle: var(--line);
  --bd-strong: var(--line-strong);
  --font-body: var(--font-sans, "Inter", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif);
  --font-code: var(--font-mono, "JetBrains Mono", "Cascadia Code", "Consolas", ui-monospace, monospace);
  --motion-fast: 120ms;
  --motion-base: 200ms;
  --motion-slow: 320ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-exit: cubic-bezier(0.4, 0, 1, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; max-width: 100%; overflow-x: hidden;
  background: var(--bg-app); color: var(--fg-main);
  font-family: var(--font-body); font-size: 13px; line-height: 1.55;
  color-scheme: light;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; border-radius: var(--radius); color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: 0.55; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: 2.5px solid var(--orange); outline-offset: 2px;
}
code, pre { font-family: var(--font-code); font-size: 11.5px; }
.workbench { max-width: 960px; margin: 0 auto; padding: 14px 16px 76px; display: flex; flex-direction: column; gap: 12px; background: var(--bg-app); color: var(--fg-main); }
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 12px;
  padding: 12px 14px; background: var(--bg-card); border: 1.5px solid var(--bd-strong);
  box-shadow: var(--shadow-focus);
}
.topbar-id { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 220px; }
.brand-row { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-logo {
  display: block; width: 28px; height: 28px; flex-shrink: 0;
  border-radius: 6px; border: 1.5px solid var(--bd-strong);
}
.project-title { margin: 0; font-size: 15.5px; font-weight: 800; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync-pill {
  font-size: 11px; font-weight: 700; padding: 1px 7px; border: 1px solid var(--info-border);
  background: var(--info-bg); color: var(--info-ink); border-radius: var(--radius); flex-shrink: 0;
}
.chip-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.session-chip {
  font-size: 11.5px; padding: 2px 8px; background: var(--bg-sub); border: 1px solid var(--bd-subtle);
  border-radius: var(--radius); color: var(--fg-muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.role-badge { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: var(--radius); border: 1.5px solid var(--bd-strong); }
.role-owner { background: var(--ok-bg); color: var(--ok-ink); border-color: var(--ok-border); }
.role-member { background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-border); }
.role-wait { background: var(--bg-sub); color: var(--fg-muted); }
.topbar-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; flex-shrink: 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  padding: 6px 11px; font-size: 12px; font-weight: 700; line-height: 1.25;
  border: 1.5px solid var(--bd-strong); background: var(--bg-card); color: var(--fg-main);
}
.btn-xs { padding: 3px 8px; font-size: 11.5px; }
.btn:hover:not(:disabled) { transform: translate(-1px, -1px); }
.btn-navy { background: var(--navy); color: var(--ink-inverse); border-color: var(--navy); }
.btn-primary { background: var(--orange); color: var(--navy); border-color: var(--bd-strong); box-shadow: 2px 2px 0 0 var(--bd-strong); }
.btn-ok { background: var(--ok-bg); color: var(--ok-ink); border-color: var(--ok-border); }
.btn-secondary-outline { background: var(--bg-card); color: var(--ok-ink); border-color: var(--ok-border); }
.btn-ghost { background: var(--bg-card); color: var(--fg-main); border-color: var(--bd-strong); }
.btn-weak-destructive { background: var(--bg-card); color: var(--fg-muted); border-color: var(--bd-subtle); }
.btn-weak-destructive:hover:not(:disabled) { background: var(--danger-bg); color: var(--danger-ink); border-color: var(--danger-border); }
.btn-confirm-danger { background: var(--danger-bg); color: var(--danger-ink); border-color: var(--danger-border); }
.btn-close {
  border: 1px solid var(--bd-subtle); background: transparent; color: var(--fg-muted);
  padding: 2px 7px; font-size: 12px; font-weight: 700; line-height: 1.3;
}
.feedback-bar {
  position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
  width: min(calc(100% - 24px), 700px); z-index: 60;
  padding: 10px 13px; border: 1.5px solid var(--bd-strong); border-radius: var(--radius);
  box-shadow: 4px 4px 0 0 var(--bd-strong);
  display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; font-weight: 600;
}
.feedback-main { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.feedback-actions { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
.tone-ok { background: var(--ok-bg); color: var(--ok-ink); border-color: var(--ok-border); }
.tone-warn { background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-border); }
.tone-error { background: var(--danger-bg); color: var(--danger-ink); border-color: var(--danger-border); }
.tone-info { background: var(--info-bg); color: var(--info-ink); border-color: var(--info-border); }
.copy-fallback-wrap { display: flex; align-items: flex-start; gap: 8px; }
.copy-fallback {
  flex: 1 1 auto; margin: 0; padding: 8px 10px; background: var(--bg-card); color: var(--fg-main);
  border: 1px solid var(--bd-strong); white-space: pre-wrap; word-break: break-word; user-select: all;
  max-height: 110px; overflow: auto;
}
.anchor-guide { margin: 0; font-size: 11.5px; color: var(--fg-muted); line-height: 1.45; }
.anchors-strip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.anchor-card {
  background: var(--bg-card); border: 1.5px solid var(--bd-strong); padding: 11px 13px;
  display: flex; flex-direction: column; gap: 6px;
}
.anchor-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.05em; color: var(--fg-muted); }
.anchor-text { margin: 0; font-size: 13.5px; font-weight: 700; word-break: break-word; color: var(--fg-main); }
.anchor-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; margin-top: 2px; }
.status-badge {
  display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700;
  padding: 2px 7px; border: 1px solid currentColor; border-radius: var(--radius); white-space: nowrap;
}
.badge-accepted { background: var(--ok-bg); color: var(--ok-ink); border-color: var(--ok-border); }
.badge-dialogue { background: #CCFBF1; color: #0F766E; border-color: #0D9488; }
.badge-proposed { background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-border); }
.badge-conflicted { background: var(--danger-bg); color: var(--danger-ink); border-color: var(--danger-border); }
.badge-missing { background: var(--bg-sub); color: var(--fg-muted); border-color: var(--bd-subtle); }
.ev-pill {
  display: inline-flex; align-items: center; font-family: var(--font-code); font-size: 11px;
  padding: 2px 7px; background: var(--bg-sub); color: var(--fg-muted); border: 1px solid var(--bd-subtle);
  border-radius: var(--radius);
}
.ev-pill.ev-gap { color: var(--warn-ink); background: var(--warn-bg); border-color: var(--warn-border); }
.priority-queue {
  background: var(--bg-card); border: 1.5px solid var(--bd-strong); padding: 9px 12px;
}
.priority-queue summary {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  cursor: pointer; font-weight: 700; font-size: 12.5px; list-style: none;
}
.priority-list { margin-top: 8px; display: flex; flex-direction: column; gap: 7px; }
.priority-item { padding: 8px 10px; background: var(--bg-sub); border-left: 3px solid var(--orange); }
.priority-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.priority-item p { margin: 4px 0 0; font-size: 12px; color: var(--fg-muted); }
.priority-meta { display: flex; gap: 10px; margin-top: 4px; font-size: 11px; color: var(--fg-muted); }
.tab-bar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tab-btn {
  padding: 8px 10px; font-size: 12.5px; font-weight: 800; background: var(--bg-card);
  border: 1.5px solid var(--bd-strong); color: var(--fg-main);
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
}
.tab-btn.is-active { background: var(--navy); color: var(--ink-inverse); box-shadow: var(--shadow-orange); }
.tab-count {
  display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px;
  padding: 0 5px; font-size: 11px; font-family: var(--font-code);
  background: var(--orange); color: var(--navy); border-radius: var(--radius);
}
.main-pane { display: flex; flex-direction: column; gap: 12px; }
.tab-panel { display: flex; flex-direction: column; gap: 12px; }
.mindmap-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.legend-row { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--fg-muted); font-weight: 600; }
.legend-item { display: inline-flex; align-items: center; gap: 4px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: var(--radius); border: 1px solid var(--bd-strong); }
.dot-ok { background: var(--ok-bg); border-color: var(--ok-border); }
.dot-dialogue { background: #CCFBF1; border-color: #0D9488; }
.dot-warn { background: var(--warn-bg); border-color: var(--warn-border); }
.dot-danger { background: var(--danger-bg); border-color: var(--danger-border); }
.mm-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border: 1px solid var(--bd-strong); border-radius: var(--radius); }
.pill-ok { background: var(--ok-bg); color: var(--ok-ink); border-color: var(--ok-border); }
.mm-canvas { display: flex; flex-direction: column; gap: 6px; }
.mm-root {
  width: 100%; text-align: left; background: var(--bg-card); border: 1.5px solid var(--bd-strong);
  border-left: 5px solid var(--ok-border); padding: 11px 14px; box-shadow: var(--shadow-focus);
  display: flex; flex-direction: column; gap: 5px;
}
.mm-root.is-selected { border-color: var(--orange); box-shadow: var(--shadow-orange); }
.mm-root-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.mm-root-title { margin: 0; font-size: 14px; font-weight: 800; color: var(--fg-main); word-break: break-word; }
.mm-trunk {
  position: relative; margin-left: 14px; padding: 8px 0 2px 18px;
  border-left: 2px solid var(--bd-strong); display: flex; flex-direction: column; gap: 10px;
}
.mm-branch { position: relative; display: flex; flex-direction: column; gap: 7px; }
.mm-branch::before {
  content: ""; position: absolute; left: -18px; top: 18px; width: 18px; height: 2px; background: var(--bd-strong);
}
.mm-branch-btn {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  padding: 8px 11px; background: var(--bg-card); border: 1.5px solid var(--bd-strong);
  border-left-width: 4px; text-align: left; gap: 8px; flex-wrap: wrap;
}
.mm-branch-btn.is-product_ux { border-left-color: var(--orange); }
.mm-branch-btn.is-architecture { border-left-color: #1D4ED8; }
.mm-branch-btn.is-execution { border-left-color: var(--ok-border); }
.mm-branch-btn.is-open_risks { border-left-color: var(--warn-border); }
.mm-branch-btn.is-archive { border-left-color: #64748B; background: var(--bg-sub); }
.mm-branch-left { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1 1 220px; }
.mm-chevron { font-size: 11px; font-weight: 900; width: 14px; flex-shrink: 0; color: var(--fg-muted); }
.mm-branch-name { font-size: 13px; font-weight: 800; color: var(--fg-main); }
.mm-branch-sub { font-size: 11.5px; color: var(--fg-muted); }
.mm-branch-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.mm-leaves {
  margin-left: 8px; padding-left: 12px; border-left: 1.5px dashed var(--bd-subtle);
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px;
}
.mm-leaf {
  display: flex; flex-direction: column; gap: 5px; padding: 9px 11px; background: var(--bg-card);
  border: 1px solid var(--bd-subtle); border-left: 4px solid var(--bd-strong); text-align: left;
}
.mm-leaf.is-accepted, .mm-leaf.is-completed { border-left-color: var(--ok-border); }
.mm-leaf.is-dialogue { border-left-color: #0D9488; }
.mm-leaf.is-proposed { border-left-color: var(--warn-border); }
.mm-leaf.is-conflicted { border-left-color: var(--danger-border); }
.mm-leaf.is-selected { border: 2px solid var(--orange); border-left-width: 4px; box-shadow: var(--shadow-orange); }
.mm-leaf-top { display: flex; align-items: center; justify-content: space-between; gap: 5px; flex-wrap: wrap; }
.mm-leaf-title {
  margin: 0; font-size: 12.5px; font-weight: 700; line-height: 1.42; color: var(--fg-main);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;
}
.mm-leaf-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 11px; color: var(--fg-muted); }
.tree-hint { margin: 0; font-size: 11.5px; color: var(--fg-muted); }
.detail-drawer {
  background: var(--bg-card); border: 2px solid var(--orange); padding: 12px 14px;
  box-shadow: var(--shadow-orange); display: flex; flex-direction: column; gap: 8px;
}
.detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.detail-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.detail-title { margin: 0; font-size: 14px; font-weight: 800; }
.detail-value { margin: 0; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; color: var(--fg-main); }
.detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 11.5px; color: var(--fg-muted); }
.detail-tech { margin-top: 2px; font-size: 11.5px; color: var(--fg-muted); }
.detail-tech summary { cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.detail-tech-body { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 8px; background: var(--bg-sub); border: 1px solid var(--bd-subtle); }
.kind-chip {
  font-size: 11px; font-weight: 800; padding: 2px 7px;
  background: var(--bg-sub); border: 1px solid var(--bd-strong); border-radius: var(--radius);
}
.section-block { display: flex; flex-direction: column; gap: 9px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.section-head h3 { margin: 0; font-size: 13.5px; font-weight: 800; }
.count-chip {
  font-family: var(--font-code); font-size: 11px; font-weight: 700; padding: 2px 8px;
  border: 1px solid var(--bd-strong); background: var(--bg-sub); border-radius: var(--radius);
}
.count-chip.danger { background: var(--danger-bg); color: var(--danger-ink); border-color: var(--danger-border); }
.count-chip.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-border); }
.count-chip.orange { background: var(--orange); color: var(--navy); border-color: var(--bd-strong); }
.conflict-card {
  background: var(--bg-card); border: 2px solid var(--danger-border); padding: 12px;
  display: flex; flex-direction: column; gap: 9px;
}
.conflict-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.conflict-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.conflict-side {
  background: var(--bg-sub); border: 1.5px solid var(--bd-strong); padding: 9px;
  display: flex; flex-direction: column; gap: 6px;
}
.side-top, .side-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.side-value { margin: 0; font-size: 12.5px; font-weight: 600; word-break: break-word; }
.item-card {
  background: var(--bg-card); border: 1px solid var(--bd-subtle); border-left: 4px solid var(--bd-strong);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 7px;
}
.item-card.is-proposed { border-left-color: var(--warn-border); }
.item-card.is-accepted { border-left-color: var(--ok-border); }
.item-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.item-title { margin: 0; font-size: 13.5px; font-weight: 800; word-break: break-word; color: var(--fg-main); }
.item-value { margin: 0; font-size: 12.5px; color: var(--fg-muted); word-break: break-word; }
.item-quote {
  margin: 0; padding: 6px 9px; background: var(--bg-sub); border-left: 2.5px solid var(--bd-strong);
  font-size: 12px; color: var(--fg-muted);
}
.item-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--fg-muted); }
.card-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 4px; }
.card-actions > .btn-weak-destructive { margin-left: auto; }
.owner-hint {
  font-size: 11.5px; font-weight: 700; color: var(--warn-ink);
  background: var(--warn-bg); border: 1px solid var(--warn-border); padding: 2px 8px; border-radius: var(--radius);
}
.split-wrap { position: relative; display: inline-flex; flex-direction: column; gap: 4px; }
.split-group { display: inline-flex; align-items: stretch; }
.split-main { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.split-toggle { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0; padding: 6px 8px; }
.split-menu {
  display: flex; flex-wrap: wrap; gap: 5px; padding: 7px;
  background: var(--bg-card); border: 1.5px solid var(--bd-strong); box-shadow: var(--shadow-focus);
}
.chip-action {
  padding: 4px 8px; font-size: 11.5px; font-weight: 700; background: var(--bg-sub);
  border: 1px solid var(--bd-strong); color: var(--fg-main);
}
.chip-action:hover:not(:disabled) { background: var(--navy); color: var(--ink-inverse); }
.quick-note-box {
  background: var(--bg-card); border: 1.5px solid var(--bd-strong); padding: 11px 13px;
  display: flex; flex-direction: column; gap: 8px;
}
.quick-note-box.is-highlighted { border: 2px solid var(--orange); box-shadow: var(--shadow-orange); }
.quick-note-form { display: flex; flex-wrap: wrap; gap: 7px; }
.quick-note-form select, .quick-note-form input, .custom-seat-label input {
  padding: 6px 9px; border: 1.5px solid var(--bd-strong); background: var(--bg-app); color: var(--fg-main); font-size: 12.5px;
}
.quick-note-form input { flex: 1 1 190px; min-width: 0; }
.stale-drawer, .accepted-drawer {
  background: var(--bg-card); border: 1.5px solid var(--bd-subtle); padding: 9px 12px;
}
.accepted-drawer { border-color: var(--bd-strong); }
.stale-drawer summary, .accepted-drawer summary {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  cursor: pointer; font-weight: 700; font-size: 12.5px; list-style: none;
}
.stale-toolbar {
  margin-top: 9px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 9px; background: var(--bg-sub); border: 1px solid var(--bd-subtle);
}
.summary-hint, .meta-text { font-size: 11.5px; color: var(--fg-muted); }
.stale-list, .accepted-list { margin-top: 9px; display: flex; flex-direction: column; gap: 8px; }
.empty-box, .skeleton-box {
  margin: 0; padding: 14px; background: var(--bg-card); border: 1.5px dashed var(--bd-subtle);
  color: var(--fg-muted); text-align: center; font-size: 12.5px;
}
.seat-grid, .tpl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.seat-card, .tpl-card {
  background: var(--bg-card); border: 1.5px solid var(--bd-strong); padding: 10px 12px;
  text-align: left; display: flex; flex-direction: column; gap: 5px;
}
.seat-card.is-owner { border-left: 4px solid var(--ok-border); }
.seat-card.is-muted { border-style: dashed; opacity: 0.92; }
.seat-top, .tpl-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.seat-brief, .tpl-card p { margin: 0; font-size: 12px; color: var(--fg-muted); }
.tpl-card.is-selected { border: 2px solid var(--orange); box-shadow: var(--shadow-orange); }
.tpl-preview {
  background: var(--bg-card); border: 1.5px solid var(--bd-strong); padding: 11px 13px;
  display: flex; flex-direction: column; gap: 8px;
}
.preview-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.preview-summary { margin: 0; font-size: 12px; color: var(--fg-muted); }
.preview-seats { display: flex; flex-direction: column; gap: 5px; }
.preview-seat-row {
  padding: 6px 9px; background: var(--bg-sub); border-left: 3px solid var(--bd-strong);
  display: flex; flex-direction: column; gap: 2px; font-size: 12px;
}
.preview-seat-row span { color: var(--fg-muted); }
.custom-seat-label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; }
.cmd-box {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 10px; background: var(--bg-sub); border: 1px solid var(--bd-strong);
}
.cmd-box code { flex: 1 1 200px; word-break: break-all; }
@media (max-width: 460px) {
  .anchors-strip, .conflict-grid, .seat-grid, .tpl-grid { grid-template-columns: 1fr; }
  .workbench { padding: 10px 10px 76px; }
}
button, .btn, .tab-btn, .mm-leaf, .item-card, .conflict-card, .seat-card, .tpl-card, summary {
  transition: color var(--motion-fast) var(--ease-out), background-color var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out), opacity var(--motion-base) var(--ease-out);
}
summary, .mm-chevron { transition: color var(--motion-fast) var(--ease-in-out), opacity var(--motion-fast) var(--ease-in-out), transform var(--motion-fast) var(--ease-in-out); }
.detail-drawer { transition: border-color var(--motion-slow) var(--ease-out), opacity var(--motion-slow) var(--ease-out); }
button:active:not(:disabled), .btn:active:not(:disabled), .tab-btn:active:not(:disabled) { transform: scale(0.97); }
@keyframes mcp-toast-in {
  from { opacity: 0; transform: translate(-50%, 8px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}
.feedback-bar.is-new { animation: mcp-toast-in var(--motion-base) var(--ease-out); }
::view-transition-old(root) { animation-duration: calc(var(--motion-base) * 0.75); animation-timing-function: var(--ease-exit); }
::view-transition-new(root) { animation-duration: var(--motion-base); animation-timing-function: var(--ease-out); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}
</style>
